<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- FIBeGS · Badge "Club Leader" — crest originale in linea con i rank ELO -->
  <defs>
    <radialGradient id="cl-glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#ffd76a" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#f2a93c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f2a93c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cl-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="28%" stop-color="#ffd76a"/>
      <stop offset="55%" stop-color="#e8a93b"/>
      <stop offset="78%" stop-color="#a96f14"/>
      <stop offset="100%" stop-color="#7a4d0b"/>
    </linearGradient>
    <linearGradient id="cl-gold-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8b04c"/>
      <stop offset="50%" stop-color="#b07712"/>
      <stop offset="100%" stop-color="#6b430a"/>
    </linearGradient>
    <linearGradient id="cl-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b2010"/>
      <stop offset="55%" stop-color="#17110a"/>
      <stop offset="100%" stop-color="#0b0805"/>
    </linearGradient>
    <linearGradient id="cl-gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7d6"/>
      <stop offset="35%" stop-color="#ffce4f"/>
      <stop offset="75%" stop-color="#f08c1b"/>
      <stop offset="100%" stop-color="#a85607"/>
    </linearGradient>
    <linearGradient id="cl-wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7e3a4"/>
      <stop offset="45%" stop-color="#d9a437"/>
      <stop offset="100%" stop-color="#8a5c10"/>
    </linearGradient>
    <filter id="cl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="cl-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- alone dorato -->
  <circle cx="128" cy="124" r="112" fill="url(#cl-glow)"/>

  <g filter="url(#cl-shadow)">
    <!-- ALI — tre piume angolari per lato, stile crest -->
    <g>
      <path d="M34 84 L86 102 L74 124 L30 110 Z" fill="url(#cl-wing)"/>
      <path d="M22 112 L78 126 L70 150 L24 138 Z" fill="url(#cl-gold-deep)"/>
      <path d="M30 142 L74 152 L70 174 L40 166 Z" fill="#6b430a"/>
      <path d="M34 84 L86 102 L74 124 L30 110 Z" fill="none" stroke="#fff3c4" stroke-opacity="0.5" stroke-width="1.4"/>
      <path d="M22 112 L78 126 L70 150 L24 138 Z" fill="none" stroke="#fff3c4" stroke-opacity="0.3" stroke-width="1.2"/>
    </g>
    <g transform="scale(-1,1) translate(-256,0)">
      <path d="M34 84 L86 102 L74 124 L30 110 Z" fill="url(#cl-wing)"/>
      <path d="M22 112 L78 126 L70 150 L24 138 Z" fill="url(#cl-gold-deep)"/>
      <path d="M30 142 L74 152 L70 174 L40 166 Z" fill="#6b430a"/>
      <path d="M34 84 L86 102 L74 124 L30 110 Z" fill="none" stroke="#fff3c4" stroke-opacity="0.5" stroke-width="1.4"/>
      <path d="M22 112 L78 126 L70 150 L24 138 Z" fill="none" stroke="#fff3c4" stroke-opacity="0.3" stroke-width="1.2"/>
    </g>

    <!-- CORONA del leader -->
    <path d="M88 64 L100 38 L114 56 L128 30 L142 56 L156 38 L168 64 L160 76 L96 76 Z"
          fill="url(#cl-gold)" stroke="#fff3c4" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="100" cy="36" r="4.5" fill="#fff3c4"/>
    <circle cx="128" cy="27" r="5.5" fill="#fff3c4"/>
    <circle cx="156" cy="36" r="4.5" fill="#fff3c4"/>
    <path d="M96 70 L160 70" stroke="#7a4d0b" stroke-width="3"/>

    <!-- SCUDO ESTERNO metallico -->
    <path d="M128 58 L186 80 L186 142 C186 178 162 202 128 216 C94 202 70 178 70 142 L70 80 Z"
          fill="url(#cl-gold)"/>
    <path d="M128 58 L186 80 L186 142 C186 178 162 202 128 216 C94 202 70 178 70 142 L70 80 Z"
          fill="none" stroke="#fff7d6" stroke-opacity="0.7" stroke-width="2.5"/>
    <!-- interno scuro -->
    <path d="M128 72 L172 89 L172 140 C172 168 154 188 128 200 C102 188 84 168 84 140 L84 89 Z"
          fill="url(#cl-dark)" stroke="#ffd76a" stroke-opacity="0.55" stroke-width="2"/>

    <!-- emblema CLUB: esagono membri attorno al leader -->
    <g stroke="#ffd76a" stroke-opacity="0.85" stroke-width="2" fill="none">
      <path d="M128 96 L152 110 L152 138 L128 152 L104 138 L104 110 Z"/>
    </g>
    <g fill="#ffd76a" filter="url(#cl-soft)">
      <circle cx="128" cy="96" r="4"/>
      <circle cx="152" cy="110" r="4"/>
      <circle cx="152" cy="138" r="4"/>
      <circle cx="128" cy="152" r="4"/>
      <circle cx="104" cy="138" r="4"/>
      <circle cx="104" cy="110" r="4"/>
    </g>

    <!-- GEMMA centrale del leader -->
    <path d="M128 104 L145 124 L128 146 L111 124 Z" fill="url(#cl-gem)" stroke="#fff7d6" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M128 104 L136.5 124 L128 146 L119.5 124 Z" fill="#fff" fill-opacity="0.22"/>
    <path d="M111 124 L145 124" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- punta inferiore -->
    <path d="M118 196 L128 216 L138 196 L128 204 Z" fill="url(#cl-gold-deep)"/>

    <!-- riflesso speculare sullo scudo -->
    <path d="M84 89 L128 72 L128 88 L92 102 Z" fill="#fff" fill-opacity="0.14"/>
  </g>
</svg>
